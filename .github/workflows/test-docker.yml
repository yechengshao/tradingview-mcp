name: Lambda image Docker tests
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.lambda'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'tests/integration/test_lambda_container.py'
      - 'tests/integration/test_lambda_adapter_rie.py'
      - 'tests/integration/fixtures/rest_v1/**'
      - 'tests/integration/support/**'
      - '.github/workflows/test-docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile.lambda'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'src/**'
      - 'tests/integration/test_lambda_container.py'
      - 'tests/integration/test_lambda_adapter_rie.py'
      - 'tests/integration/fixtures/rest_v1/**'
      - 'tests/integration/support/**'
      - '.github/workflows/test-docker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.13.1'
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --dev --group deployment --locked
      - uses: docker/setup-buildx-action@v3
      - name: Build the Lambda image for native ARM64 testing
        run: |
          set -euo pipefail
          LOCK_SHA256=$(sha256sum uv.lock | cut -d' ' -f1)
          docker buildx build --platform linux/arm64 --provenance=false --sbom=false --load \
            -f Dockerfile.lambda --build-arg SOURCE_COMMIT="$GITHUB_SHA" --build-arg SOURCE_DIRTY=false \
            --build-arg LOCK_SHA256="$LOCK_SHA256" -t lambda-tested:local .
      - name: Download the arm64 Lambda Runtime Interface Emulator
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/aws-lambda-rie" \
            https://github.com/aws/aws-lambda-runtime-interface-emulator/releases/latest/download/aws-lambda-rie-arm64
          chmod +x "$RUNNER_TEMP/aws-lambda-rie"
      - name: Run image tests against the built image
        env:
          LAMBDA_TEST_IMAGE: lambda-tested:local
          RIE_BINARY: ${{ runner.temp }}/aws-lambda-rie
          REQUIRE_LAMBDA_CONTAINER_TESTS: '1'
        run: uv run --locked --group deployment pytest -q tests/integration/test_lambda_container.py tests/integration/test_lambda_adapter_rie.py
