{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "TradingView MCP Lambda image repository (retained; supplied authorization is external).",
  "Parameters": {
    "RepositoryName": {
      "Type": "String",
      "Default": "tradingview-mcp-lambda",
      "AllowedPattern": "[a-z][a-z0-9._/-]{1,254}"
    }
  },
  "Resources": {
    "Repository": {
      "Type": "AWS::ECR::Repository",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "RepositoryName": {
          "Ref": "RepositoryName"
        },
        "ImageTagMutability": "IMMUTABLE",
        "ImageScanningConfiguration": {
          "ScanOnPush": true
        },
        "EncryptionConfiguration": {
          "EncryptionType": "AES256"
        },
        "RepositoryPolicyText": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "LambdaPull",
              "Effect": "Allow",
              "Principal": {
                "Service": "lambda.amazonaws.com"
              },
              "Action": [
                "ecr:BatchGetImage",
                "ecr:GetDownloadUrlForLayer"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": {
                    "Ref": "AWS::AccountId"
                  }
                },
                "ArnLike": {
                  "aws:SourceArn": {
                    "Fn::Sub": "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*"
                  }
                }
              }
            }
          ]
        },
        "Tags": [
          {
            "Key": "Project",
            "Value": "tradingview-mcp"
          },
          {
            "Key": "Feature",
            "Value": "001-add-lambda-deployment"
          },
          {
            "Key": "Stack",
            "Value": {
              "Ref": "AWS::StackName"
            }
          }
        ]
      }
    }
  },
  "Outputs": {
    "RepositoryName": {
      "Value": {
        "Ref": "Repository"
      }
    },
    "RepositoryUri": {
      "Value": {
        "Fn::GetAtt": [
          "Repository",
          "RepositoryUri"
        ]
      }
    }
  }
}
