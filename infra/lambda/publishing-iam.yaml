{
  "AWSTemplateFormatVersion": "2010-09-09",
  "Description": "Service publishing IAM: GitHub OIDC provider (created once, retained) and a role that can only push the tested image to the MCP ECR repository from the lambda-publication environment. No deployment, Lambda, billing or identity permissions.",
  "Parameters": {
    "PublicationEnvironment": {
      "Type": "String",
      "Default": "lambda-publication",
      "AllowedPattern": "[A-Za-z0-9_-]{1,64}"
    },
    "RepositoryName": {
      "Type": "String",
      "Default": "tradingview-mcp-lambda",
      "AllowedPattern": "[a-z][a-z0-9._/-]{1,254}"
    },
    "GithubSubjectPrefix": {
      "Type": "String",
      "Default": "repo:yechengshao@7886247/tradingview-mcp@1423980237",
      "AllowedPattern": "repo:[A-Za-z0-9_.-]+@[0-9]+/[A-Za-z0-9_.-]+@[0-9]+",
      "Description": "Immutable GitHub subject claim prefix (owner@id/repo@id) for the repository."
    }
  },
  "Resources": {
    "GitHubOidcProvider": {
      "Type": "AWS::IAM::OIDCProvider",
      "DeletionPolicy": "Retain",
      "UpdateReplacePolicy": "Retain",
      "Properties": {
        "Url": "https://token.actions.githubusercontent.com",
        "ClientIdList": [
          "sts.amazonaws.com"
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "tradingview-mcp"
          },
          {
            "Key": "Feature",
            "Value": "001-add-lambda-deployment"
          }
        ]
      }
    },
    "PublisherRole": {
      "Type": "AWS::IAM::Role",
      "Properties": {
        "RoleName": {
          "Fn::Sub": "${AWS::StackName}-publisher"
        },
        "AssumeRolePolicyDocument": {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Federated": {
                  "Ref": "GitHubOidcProvider"
                }
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
                  "token.actions.githubusercontent.com:sub": {
                    "Fn::Sub": "${GithubSubjectPrefix}:environment:${PublicationEnvironment}"
                  }
                }
              }
            }
          ]
        },
        "Policies": [
          {
            "PolicyName": "PushTestedImage",
            "PolicyDocument": {
              "Version": "2012-10-17",
              "Statement": [
                {
                  "Effect": "Allow",
                  "Action": "ecr:GetAuthorizationToken",
                  "Resource": "*"
                },
                {
                  "Effect": "Allow",
                  "Action": [
                    "ecr:BatchCheckLayerAvailability",
                    "ecr:CompleteLayerUpload",
                    "ecr:UploadLayerPart",
                    "ecr:InitiateLayerUpload",
                    "ecr:PutImage",
                    "ecr:BatchGetImage",
                    "ecr:GetDownloadUrlForLayer"
                  ],
                  "Resource": {
                    "Fn::Sub": "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}"
                  }
                }
              ]
            }
          }
        ],
        "Tags": [
          {
            "Key": "Project",
            "Value": "tradingview-mcp"
          },
          {
            "Key": "Feature",
            "Value": "001-add-lambda-deployment"
          }
        ]
      }
    }
  },
  "Outputs": {
    "GitHubOidcProviderArn": {
      "Value": {
        "Ref": "GitHubOidcProvider"
      }
    },
    "PublisherRoleArn": {
      "Value": {
        "Fn::GetAtt": [
          "PublisherRole",
          "Arn"
        ]
      }
    }
  }
}
